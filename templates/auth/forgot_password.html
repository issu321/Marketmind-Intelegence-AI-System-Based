{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}
.auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    text-align: center;
}
.auth-header {
    margin-bottom: 2rem;
}
.auth-header .logo-icon {
    width: 56px;
    height: 56px;
    background: var(--gradient-primary);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
    margin: 0 auto 1rem;
}
.auth-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
.auth-header p { color: var(--text-secondary); font-size: 0.875rem; }
.auth-form .form-group { margin-bottom: 1.25rem; text-align: left; }
.auth-btn {
    width: 100%;
    padding: 0.875rem;
    background: var(--gradient-primary);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    font-family: var(--font-main);
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.auth-btn:hover { box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
.auth-footer {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
    font-size: 0.875rem;
}
.auth-footer a { color: var(--accent-blue); text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon"><i class="fas fa-key"></i></div>
            <h1>Reset Password</h1>
            <p>Enter your email and we'll send you reset instructions.</p>
        </div>
        <form class="auth-form" method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="auth-btn">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        <div class="auth-footer">
            <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
